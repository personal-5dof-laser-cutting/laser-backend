[project]
name = "laser-backend"
version = "0.1.0"
description = "Backend for 5DOF laser system"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.119.1",
    "geometry3d>=0.3.0",
    "matplotlib>=3.10.7",
    "networkx>=3.5",
    "pillow>=12.0.0",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    "pytest>=8.4.2",
    "ruff==0.14.1",
    "uvicorn>=0.38.0",
    "vpython>=7.6.5",
    "svgpathtools>=1.7.1",
    "gcode-lib",
    "websockets>=16.0",
    "mpl-interactions>=0.24.2",
]

[dependency-groups]
dev = ["pre-commit-uv==4.2.0"]


[tool.pytest.ini_options]
pythonpath = [""]

[tool.uv.sources]
gcode-lib = { git = "https://github.com/HCI-BP-25-26/gcode_lib.git" }
