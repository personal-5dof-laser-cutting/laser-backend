[project]
name = "laser-backend"
version = "0.1.0"
description = "Backend for 5DOF laser system"
requires-python = ">=3.14"
dependencies = [
    "affine>=2.4.0",
    "dependency-injector==4.48.2",
    "fastapi>=0.119.1",
    "geometry3d>=0.3.0",
    "matplotlib>=3.10.7",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    "pytest>=8.4.2",
    "ruff==0.14.1",
    "shapely>=2.1.2",
    "uvicorn>=0.38.0",
]
[dependency-groups]
dev = ["pre-commit-uv==4.2.0"]

